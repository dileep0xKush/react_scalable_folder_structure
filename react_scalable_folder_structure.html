  h3 { font-family: var(--font-sans); font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
</style>

  <div class="legend">

</div>
<script>

const tree = [
  {name:'my-app/', badge:null, tip:'Project root', children:[

      {name:'index.html',type:'html',tip:'HTML entry point'},

    ]},
    {name:'src/', badge:null, tip:'All application source code', children:[
      {name:'assets/', badge:'b-coral', tip:'Static media: images, fonts, icons', children:[
        {name:'images/',badge:null,tip:'',children:[{name:'logo.svg',type:'file'}]},
        {name:'fonts/',badge:null,tip:'',children:[{name:'inter.woff2',type:'file'}]},

      {name:'components/', badge:'b-green', tip:'Shared, reusable UI components', children:[

          {name:'Button/',badge:null,tip:'',children:[
            {name:'Button.tsx',type:'tsx',tip:'Component logic & JSX'},
            {name:'Button.module.css',type:'css',tip:'Scoped styles'},

          ]},
          {name:'Input/',badge:null,tip:'',children:[{name:'Input.tsx',type:'tsx'},{name:'index.ts',type:'ts'}]},
          {name:'Modal/',badge:null,tip:'',children:[{name:'Modal.tsx',type:'tsx'},{name:'index.ts',type:'ts'}]},
        ]},
        {name:'layout/', badge:null, tip:'Page chrome (nav, sidebars)', children:[
          {name:'Navbar.tsx',type:'tsx',tip:'Top navigation bar'},
          {name:'Sidebar.tsx',type:'tsx',tip:'Side navigation panel'},
          {name:'Footer.tsx',type:'tsx',tip:'Page footer'},
          {name:'RootLayout.tsx',type:'tsx',tip:'Wraps every page'},
        ]},
        {name:'shared/', badge:null, tip:'Domain-agnostic feature pieces', children:[
          {name:'DataTable.tsx',type:'tsx',tip:'Generic sortable table'},
          {name:'Pagination.tsx',type:'tsx',tip:'Generic pagination'},
          {name:'ErrorBoundary.tsx',type:'tsx',tip:'Catches render errors'},
        ]},
      ]},
      {name:'features/', badge:'b-green', tip:'Self-contained feature modules', children:[
        {name:'auth/', badge:null, tip:'Login, signup, session', children:[
          {name:'components/',badge:null,tip:'',children:[{name:'LoginForm.tsx',type:'tsx'},{name:'AuthGuard.tsx',type:'tsx'}]},
          {name:'hooks/',badge:null,tip:'',children:[{name:'useAuth.ts',type:'ts',tip:'Auth state & actions'}]},
          {name:'api/',badge:null,tip:'',children:[{name:'authApi.ts',type:'ts',tip:'Auth endpoint calls'}]},
          {name:'store/',badge:null,tip:'',children:[{name:'authSlice.ts',type:'ts',tip:'Redux / Zustand slice'}]},
          {name:'index.ts',type:'ts',tip:'Public API for this feature'},

        {name:'dashboard/', badge:null, tip:'Main dashboard feature', children:[
          {name:'components/',badge:null,tip:'',children:[{name:'StatsCard.tsx',type:'tsx'},{name:'Chart.tsx',type:'tsx'}]},

        ]},
        {name:'products/', badge:null, tip:'Products feature', children:[
          {name:'components/',badge:null,tip:'',children:[{name:'ProductList.tsx',type:'tsx'},{name:'ProductCard.tsx',type:'tsx'}]},
          {name:'index.ts',type:'ts'},

      ]},
      {name:'pages/', badge:'b-blue', tip:'Route-level page components', children:[
        {name:'HomePage.tsx',type:'tsx',tip:'/ route'},
        {name:'DashboardPage.tsx',type:'tsx',tip:'/dashboard route'},
        {name:'ProductsPage.tsx',type:'tsx',tip:'/products route'},
        {name:'NotFoundPage.tsx',type:'tsx',tip:'404 fallback'},
      ]},
      {name:'hooks/', badge:'b-teal', tip:'App-wide custom React hooks', children:[
        {name:'useDebounce.ts',type:'ts',tip:'Debounce any value'},
        {name:'useLocalStorage.ts',type:'ts',tip:'Persist state to localStorage'},

      {name:'store/', badge:'b-teal', tip:'Global state management (Redux / Zustand)', children:[
        {name:'index.ts',type:'ts',tip:'Store configuration'},

        {name:'middleware/',badge:null,tip:'',children:[{name:'logger.ts',type:'ts'},{name:'errorHandler.ts',type:'ts'}]},
      ]},
      {name:'services/', badge:'b-purple', tip:'External integrations & API layer', children:[
        {name:'api/',badge:null,tip:'Base HTTP client',children:[
          {name:'client.ts',type:'ts',tip:'Axios / fetch instance'},
          {name:'interceptors.ts',type:'ts',tip:'Auth headers, error handling'},
        ]},
        {name:'analytics.ts',type:'ts',tip:'Analytics events (GA, Segment)'},
        {name:'sentry.ts',type:'ts',tip:'Error tracking setup'},
      ]},
      {name:'utils/', badge:'b-amber', tip:'Pure helper functions', children:[
        {name:'formatDate.ts',type:'ts',tip:'Date formatting'},
        {name:'formatCurrency.ts',type:'ts',tip:'Currency helpers'},
        {name:'validators.ts',type:'ts',tip:'Form validation rules'},

      {name:'types/', badge:'b-gray', tip:'Shared TypeScript type definitions', children:[
        {name:'api.types.ts',type:'ts',tip:'API response shapes'},
        {name:'user.types.ts',type:'ts',tip:'User & auth types'},
        {name:'common.types.ts',type:'ts',tip:'Generic utility types'},

      {name:'config/', badge:'b-gray', tip:'Environment-aware configuration', children:[
        {name:'env.ts',type:'ts',tip:'Typed env var access'},
        {name:'routes.ts',type:'ts',tip:'Route path constants'},
        {name:'theme.ts',type:'ts',tip:'Design token JS object'},
      ]},
      {name:'router/', badge:'b-blue', tip:'Routing setup', children:[
        {name:'AppRouter.tsx',type:'tsx',tip:'Route definitions'},
        {name:'ProtectedRoute.tsx',type:'tsx',tip:'Auth-gated wrapper'},
        {name:'lazyRoutes.ts',type:'ts',tip:'Code-split imports'},
      ]},
      {name:'App.tsx',type:'tsx',tip:'Root component, providers'},
      {name:'main.tsx',type:'tsx',tip:'ReactDOM.render entry'},
      {name:'vite-env.d.ts',type:'ts',tip:'Vite type declarations'},
    ]},
    {name:'tests/', badge:'b-gray', tip:'Integration & e2e tests', children:[
      {name:'e2e/',badge:null,tip:'',children:[{name:'auth.spec.ts',type:'test',tip:'Playwright / Cypress specs'}]},
      {name:'setup.ts',type:'ts',tip:'Jest / Vitest global setup'},
    ]},
    {name:'.env.example',type:'file',tip:'Document required env vars'},
    {name:'tsconfig.json',type:'json',tip:'TypeScript config'},
    {name:'vite.config.ts',type:'ts',tip:'Vite build config'},
    {name:'package.json',type:'json',tip:'Dependencies & scripts'},
  ]}
];

const badges = {
  'assets/':'b-coral','styles/':'b-coral',
  'components/':'b-green','features/':'b-green',
  'pages/':'b-blue','router/':'b-blue',
  'hooks/':'b-teal','store/':'b-teal',
  'services/':'b-purple',
  'utils/':'b-amber',
  'types/':'b-gray','config/':'b-gray','tests/':'b-gray',
};

function typeClass(t){ return t==='tsx'?'tsx':t==='css'?'css':t==='test'?'test':t==='json'?'json':'ts'; }
function icon(node){
  if(node.children) return '📁';
  const t = node.type||'file';
  if(t==='tsx') return '⚛';
  if(t==='ts') return '🔷';
  if(t==='css') return '🎨';
  if(t==='test') return '🧪';
  if(t==='json') return '{}';
  return '·';
}

let html = '';
function render(nodes, depth, prefix){
  nodes.forEach((node, i) => {
    const last = i===nodes.length-1;
    const branch = last ? '└─ ' : '├─ ';
    const childPfx = prefix + (last ? '   ' : '│  ');
    const isFolder = !!node.children;
    const badgeCls = node.badge || (isFolder && badges[node.name]) || '';
    const badgeHtml = badgeCls ? `<span class="badge ${badgeCls}" style="margin-left:6px">${badgeCls.replace('b-','')}</span>` : '';
    const tipHtml = node.tip ? `<span class="tooltip">${node.tip}</span>` : '';
    const nameClass = isFolder ? 'folder' : 'file '+(node.type?typeClass(node.type):'');
    html += `<div class="row"><span class="prefix">${prefix}${branch}</span><span class="prefix" style="margin-right:3px">${icon(node)}</span><span class="${nameClass}">${node.name}</span>${badgeHtml}${tipHtml}</div>`;
    if(node.children) render(node.children, depth+1, childPfx);
  });
}
render(tree, 0, '');
document.getElementById('tree').innerHTML = html;
</script>
